eck on all text</text><text x="909" y="316" font-size="14" fill="#344054">Hit or failure: review</text><rect x="1160" y="230" width="250" height="120" rx="10" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="1174" y="256" font-size="17" font-weight="700" fill="#101828">Consistency checker</text><text x="1174" y="278" font-size="14" fill="#344054">Quantities, values, weights,</text><text x="1174" y="297" font-size="14" fill="#344054">origin, unreadable or</text><text x="1174" y="316" font-size="14" fill="#344054">missing documents</text><path d="M860 290 H893" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><path d="M1125 290 H1158" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><rect x="1160" y="70" width="250" height="70" rx="10" fill="#FDE8E8" stroke="#C0392B" stroke-width="2"/><text x="1174" y="96" font-size="17" font-weight="700" fill="#101828">Error alert workflow</text><text x="1174" y="118" font-size="14" fill="#344054">Emails owner if a run fails</text><path d="M1285 350 V470 H155 V553" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="555" width="230" height="95" rx="10" fill="#E8F0FE" stroke="#3B6FD4" stroke-width="2"/><text x="54" y="581" font-size="17" font-weight="700" fill="#101828">HS classifier (agent)</text><text x="54" y="603" font-size="14" fill="#344054">Up to 3 codes, tariff quote</text><text x="54" y="622" font-size="14" fill="#344054">Fallback model on outage</text><rect x="40" y="710" width="230" height="70" rx="10" fill="#F4EEFB" stroke="#8A63C9" stroke-width="2"/><text x="54" y="736" font-size="17" font-weight="700" fill="#101828">Tariff index</text><text x="54" y="758" font-size="14" fill="#344054">Supabase vector search</text><path d="M155 708 V652" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><text x="165" y="686" font-size="13" fill="#475467">search</text><rect x="320" y="555" width="250" height="95" rx="10" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="334" y="581" font-size="17" font-weight="700" fill="#101828">Rules and grounding</text><text x="334" y="603" font-size="14" fill="#344054">Code in tariff? Restricted?</text><text x="334" y="622" font-size="14" fill="#344054">Confidence 0.8 or higher?</text><rect x="320" y="710" width="250" height="70" rx="10" fill="#F4EEFB" stroke="#8A63C9" stroke-width="2"/><text x="334" y="736" font-size="17" font-weight="700" fill="#101828">Tariff and restricted list</text><text x="334" y="758" font-size="14" fill="#344054">Google Sheets</text><path d="M270 602 H318" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><path d="M445 708 V652" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><polygon points="620,602 700,550 780,602 700,654" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="700" y="608" font-size="16" font-weight="700" fill="#101828" text-anchor="middle">Any issue?</text><path d="M570 602 H618" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><rect x="840" y="520" width="220" height="60" rx="10" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="854" y="556.0" font-size="17" font-weight="700" fill="#101828">Ready for broker</text><rect x="840" y="625" width="220" height="60" rx="10" fill="#FDF0D5" stroke="#D99A1A" stroke-width="2"/><text x="854" y="661.0" font-size="17" font-weight="700" fill="#101828">Human review + reasons</text><path d="M760 589 C800 560 800 550 838 550" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><text x="790" y="540" font-size="13" fill="#475467" text-anchor="middle">no</text><path d="M760 615 C800 650 800 655 838 655" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><text x="790" y="672" font-size="13" fill="#475467" text-anchor="middle">yes</text><rect x="1110" y="555" width="250" height="95" rx="10" fill="#E6F4EA" stroke="#2E8B57" stroke-width="2"/><text x="1124" y="581" font-size="17" font-weight="700" fill="#101828">Report and email</text><text x="1124" y="603" font-size="14" fill="#344054">Declaration draft, no code if unsure</text><text x="1124" y="622" font-size="14" fill="#344054">Broker decides, nothing submitted</text><path d="M1060 550 C1085 550 1085 590 1108 590" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><path d="M1060 655 C1085 655 1085 620 1108 620" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><rect x="1400" y="565" width="170" height="75" rx="10" fill="#F4EEFB" stroke="#8A63C9" stroke-width="2"/><text x="1414" y="591" font-size="17" font-weight="700" fill="#101828">Run log</text><text x="1414" y="613" font-size="14" fill="#344054">Google Sheets</text><path d="M1360 602 H1398" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="805" width="18" height="18" rx="4" fill="#E8F0FE" stroke="#3B6FD4" stroke-width="2"/><text x="66" y="819" font-size="14" fill="#344054">AI (Google Gemini)</text><rect x="254" y="805" width="18" height="18" rx="4" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="280" y="819" font-size="14" fill="#344054">Plain code / n8n</text><rect x="452" y="805" width="18" height="18" rx="4" fill="#FDF0D5" stroke="#D99A1A" stroke-width="2"/><text x="478" y="819" font-size="14" fill="#344054">Guardrail</text><rect x="594" y="805" width="18" height="18" rx="4" fill="#F4EEFB" stroke="#8A63C9" stroke-width="2"/><text x="620" y="819" font-size="14" fill="#344054">Data</text><rect x="696" y="805" width="18" height="18" rx="4" fill="#E6F4EA" stroke="#2E8B57" stroke-width="2"/><text x="722" y="819" font-size="14" fill="#344054">Person decides</text><rect x="878" y="805" width="18" height="18" rx="4" fill="#FDE8E8" stroke="#C0392B" stroke-width="2"/><text x="904" y="819" font-size="14" fill="#344054">Alert</text></svg>